<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金融智能分析助手 - 对话</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <style>
    /* --- 对话页面样式 --- */

    /* 聊天区域 */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: var(--stack-lg) calc(var(--stack-lg) * 2);
    }

    .messages-container::-webkit-scrollbar {
      width: 6px;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background: var(--color-outline-variant);
      border-radius: 3px;
    }

    /* 欢迎界面 */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: var(--stack-lg);
      text-align: center;
      gap: var(--stack-lg);
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-container));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 8px 32px rgba(0, 35, 111, 0.2);
    }

    .welcome-title {
      font: var(--font-headline-lg);
      font-size: 28px;
      color: var(--color-on-surface);
    }

    .welcome-desc {
      font: var(--font-body-md);
      color: var(--color-on-surface-variant);
      max-width: 480px;
      line-height: 1.7;
    }

    .welcome-suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--stack-md);
      max-width: 600px;
      width: 100%;
    }

    .suggestion-card {
      display: flex;
      align-items: flex-start;
      gap: var(--stack-sm);
      padding: var(--stack-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface-container-lowest);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: left;
    }

    .suggestion-card:hover {
      border-color: var(--color-primary);
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
    }

    .suggestion-card svg {
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--color-primary);
    }

    .suggestion-text {
      font-size: 13px;
      color: var(--color-on-surface-variant);
      line-height: 1.5;
    }

    /* 消息气泡 */
    .message {
      display: flex;
      gap: var(--stack-md);
      margin-bottom: var(--stack-lg);
      max-width: 760px;
      animation: messageIn 0.3s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-user {
      flex-direction: row-reverse;
      margin-left: auto;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message-user .message-avatar {
      background: var(--color-primary);
      color: var(--color-on-primary);
    }

    .message-assistant .message-avatar {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-container));
      color: white;
    }

    .message-body {
      flex: 1;
      min-width: 0;
    }

    .message-content {
      padding: var(--stack-md) var(--stack-md);
      border-radius: var(--radius-md);
      font: var(--font-body-md);
      line-height: 1.7;
      word-wrap: break-word;
    }

    .message-user .message-content {
      background: var(--color-primary);
      color: var(--color-on-primary);
      border-bottom-right-radius: var(--radius-sm);
    }

    .message-assistant .message-content {
      background: var(--color-surface-container-lowest);
      border: 1px solid var(--color-border);
      border-bottom-left-radius: var(--radius-sm);
      border-left: 3px solid var(--color-success);
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: var(--stack-sm);
      margin-top: 6px;
      font: var(--font-caption);
      color: var(--color-outline);
    }

    .message-user .message-meta {
      justify-content: flex-end;
    }

    .message-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .message:hover .message-actions {
      opacity: 1;
    }

    .message-action-btn {
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--color-on-surface-variant);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all var(--transition-fast);
    }

    .message-action-btn:hover {
      background: var(--color-surface-container);
      color: var(--color-on-surface);
    }

    /* 打字指示器 */
    .typing-indicator {
      display: flex;
      gap: var(--stack-md);
      margin-bottom: var(--stack-lg);
      max-width: 760px;
    }

    .typing-dots {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: var(--stack-md);
      background: var(--color-surface-container-lowest);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      border-left: 3px solid var(--color-success);
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-outline);
      animation: typingBounce 1.4s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* 输入区域 */
    .chat-input-area {
      padding: var(--stack-md) calc(var(--stack-lg) * 2) var(--stack-lg);
      background: var(--color-background);
    }

    .chat-input-wrapper {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: var(--stack-sm);
      background: var(--color-surface-container-lowest);
      border: 1px solid var(--color-outline-variant);
      border-radius: var(--radius-md);
      padding: var(--stack-sm) var(--stack-sm) var(--stack-sm) var(--stack-md);
      transition: all var(--transition-fast);
    }

    .chat-input-wrapper:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(0, 35, 111, 0.1);
    }

    .chat-input {
      flex: 1;
      resize: none;
      min-height: 24px;
      max-height: 120px;
      padding: 6px 0;
      font: var(--font-body-md);
      line-height: 1.5;
    }

    .chat-input::placeholder {
      color: var(--color-outline);
    }

    .btn-send {
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      background: var(--color-primary);
      color: var(--color-on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .btn-send:hover {
      background: var(--color-primary-container);
    }

    .btn-send:disabled {
      background: var(--color-surface-container);
      color: var(--color-outline);
      cursor: default;
    }

    /* 工具栏（知识库/模型选择） */
    .chat-toolbar {
      max-width: 760px;
      margin: var(--stack-sm) auto 0;
      display: flex;
      align-items: center;
      gap: var(--stack-sm);
      position: relative;
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-on-surface-variant);
      background: var(--color-surface-container);
      transition: all var(--transition-fast);
      cursor: pointer;
    }

    .toolbar-btn:hover {
      background: var(--color-surface-container-high);
      color: var(--color-on-surface);
    }

    .toolbar-btn.active {
      background: var(--color-primary-fixed);
      color: var(--color-primary);
    }

    .toolbar-btn svg {
      flex-shrink: 0;
    }

    /* 已选标签 */
    .selected-tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      color: var(--color-on-primary);
      font-size: 10px;
      font-weight: 600;
      line-height: 16px;
    }

    /* 知识库弹出面板 */
    .kb-panel {
      position: absolute;
      bottom: 100%;
      left: 0;
      width: 340px;
      max-height: 400px;
      margin-bottom: 8px;
      background: var(--color-surface-container-lowest);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-2);
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: all var(--transition-fast);
      z-index: 20;
      overflow: hidden;
    }

    .kb-panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--color-border);
    }

    .kb-tab {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-outline);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all var(--transition-fast);
    }

    .kb-tab:hover {
      color: var(--color-on-surface);
    }

    .kb-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }

    .kb-panel.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .kb-panel-search {
      padding: var(--stack-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .kb-panel-search input {
      width: 100%;
      padding: 6px 10px 6px 32px;
      border: 1px solid var(--color-outline-variant);
      border-radius: var(--radius);
      font-size: 13px;
      background: var(--color-surface-container-low);
      transition: all var(--transition-fast);
    }

    .kb-panel-search input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(0, 35, 111, 0.1);
    }

    .kb-panel-search .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-outline);
      pointer-events: none;
    }

    .kb-panel-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--stack-sm);
    }

    .kb-panel-list::-webkit-scrollbar {
      width: 4px;
    }

    .kb-panel-list::-webkit-scrollbar-thumb {
      background: var(--color-outline-variant);
      border-radius: 2px;
    }

    .kb-item {
      display: flex;
      align-items: center;
      gap: var(--stack-sm);
      padding: 8px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .kb-item:hover {
      background: var(--color-surface-container);
    }

    .kb-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
      flex-shrink: 0;
      cursor: pointer;
    }

    .kb-item-info {
      flex: 1;
      min-width: 0;
    }

    .kb-item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kb-item-meta {
      font-size: 11px;
      color: var(--color-outline);
      margin-top: 1px;
    }

    .kb-selected-names {
      font-size: 11px;
      color: var(--color-outline);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 模型选择面板 */
    .model-panel {
      position: absolute;
      bottom: 100%;
      left: 0;
      width: 240px;
      margin-bottom: 8px;
      background: var(--color-surface-container-lowest);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-2);
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: all var(--transition-fast);
      z-index: 20;
      overflow: hidden;
    }

    .model-panel.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .model-panel-title {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-outline);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--color-border);
    }

    .model-option {
      display: flex;
      align-items: center;
      gap: var(--stack-sm);
      padding: 8px 12px;
      cursor: pointer;
      transition: background var(--transition-fast);
      font-size: 13px;
      color: var(--color-on-surface-variant);
    }

    .model-option:hover {
      background: var(--color-surface-container);
    }

    .model-option.selected {
      color: var(--color-primary);
      font-weight: 500;
    }

    .model-option .model-check {
      width: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .model-option .model-name {
      flex: 1;
    }

    .model-option .model-provider {
      font-size: 11px;
      color: var(--color-outline);
    }

    .chat-input-hint {
      text-align: center;
      font: var(--font-caption);
      color: var(--color-outline);
      margin-top: var(--stack-sm);
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 移动端汉堡按钮 */
    .btn-hamburger {
      display: none;
    }

    @media (max-width: 768px) {
      .btn-hamburger {
        display: flex;
      }

      .messages-container {
        padding: var(--stack-md);
      }

      .chat-input-area {
        padding: var(--stack-md);
      }

      .welcome-suggestions {
        grid-template-columns: 1fr;
      }

      .kb-panel, .model-panel {
        width: calc(100vw - 32px);
      }
    }

    /* Markdown 渲染样式 */
    .message-content h1, .message-content h2, .message-content h3 {
      margin: 0.6em 0 0.3em;
      font-weight: 600;
    }
    .message-content h1 { font-size: 1.3em; }
    .message-content h2 { font-size: 1.15em; }
    .message-content h3 { font-size: 1.05em; }
    .message-content p { margin: 0.4em 0; line-height: 1.7; }
    .message-content ul, .message-content ol { margin: 0.4em 0; padding-left: 1.5em; }
    .message-content li { margin: 0.15em 0; }
    .message-content blockquote {
      margin: 0.5em 0; padding: 0.4em 1em;
      border-left: 3px solid var(--color-primary);
      background: var(--color-bg-hover);
      border-radius: 0 8px 8px 0;
    }
    .message-content code {
      background: var(--color-bg-hover); padding: 0.15em 0.4em;
      border-radius: 4px; font-size: 0.9em;
    }
    .message-content pre {
      margin: 0.5em 0; padding: 1em;
      background: #1e1e2e; color: #cdd6f4;
      border-radius: 8px; overflow-x: auto;
    }
    .message-content pre code {
      background: none; padding: 0; font-size: 0.88em;
      color: inherit;
    }
    .message-content table { border-collapse: collapse; margin: 0.5em 0; width: 100%; }
    .message-content th, .message-content td {
      border: 1px solid var(--color-border); padding: 0.4em 0.8em; text-align: left;
    }
    .message-content th { background: var(--color-bg-hover); font-weight: 600; }
    .message-content hr { border: none; border-top: 1px solid var(--color-border); margin: 0.8em 0; }
    .message-content strong { font-weight: 600; }

    /* 深度研究模式指示 */
    .toolbar-btn.deep-research-active {
      background: var(--color-primary) !important;
      color: var(--color-on-primary) !important;
    }

    /* Deep Research 子任务卡片 */
    .dr-task-card {
      background: var(--color-surface-container-lowest);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--stack-sm) var(--stack-md);
      margin-bottom: 6px;
      font-size: 13px;
      line-height: 1.5;
    }
    .dr-task-card .dr-task-title {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dr-task-card .dr-task-num {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--color-primary); color: var(--color-on-primary);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; flex-shrink: 0;
    }
    .dr-task-card .dr-task-tools {
      margin-top: 4px;
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .dr-task-card .dr-tool-tag {
      font-size: 10px; padding: 1px 6px; border-radius: var(--radius-full);
      background: var(--color-primary-fixed); color: var(--color-primary);
    }
    .dr-progress-bar {
      display: flex; gap: 4px; margin: 8px 0;
    }
    .dr-progress-bar .dr-step {
      height: 4px; flex: 1; border-radius: 2px;
      background: var(--color-outline-variant);
      transition: background var(--transition-fast);
    }
    .dr-progress-bar .dr-step.done { background: var(--color-success); }
    .dr-progress-bar .dr-step.running { background: var(--color-primary); animation: drPulse 1s ease-in-out infinite; }
    @keyframes drPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <!-- 移动端遮罩 -->
  <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

  <div class="app-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">FA</div>
        <span class="sidebar-title">FinAssist</span>
      </div>

      <div class="sidebar-actions">
        <button class="btn-new-chat" onclick="newChat()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新建对话
        </button>
      </div>

      <div class="sidebar-section-title">近期对话</div>

      <ul class="sidebar-list" id="chatList"></ul>

      <!-- 底部导航 -->
      <nav class="sidebar-nav">
        <a href="chat.html" class="nav-item active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          对话
        </a>
        <a href="research.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          深度研究
        </a>
        <a href="knowledge.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          知识库
        </a>
                <a href="stats.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
          Token 统计
        </a>
        <a href="settings.html" class="nav-item">

              <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

  <script src="js/api.js"></script>
  <script>
    // --- 状态管理 ---
    let messages = [];
    let isLoading = false;
    let currentChatId = null;
    let selectedDocIds = new Set();  // 选中的文档 ID
    let selectedKbIds = new Set();   // 选中的知识库分类 ID
    let currentModel = 'qwen-max';
    let currentKbTab = 'category';   // 当前 Tab: category | document
    let deepResearchActive = false;  // 深度研究模式
    let drPlanData = null;           // 当前 Plan 数据

    // --- 从 API 加载数据 ---
    let kbCategories = [];
    let kbDocuments = [];
    let models = [];

    async function loadInitialData() {
      try {
        const [kbData, modelData] = await Promise.all([
          api('GET', '/knowledge-bases'),
          api('GET', '/models'),
        ]);
        kbCategories = kbData.categories || [];
        kbDocuments = kbData.documents || [];
        models = modelData;
        renderKbList();
        renderModelList();
        await loadSessionList();
        // 如果有历史会话，加载最近一个
        const firstItem = chatList.querySelector('.sidebar-item');
        if (firstItem) {
          await loadSession(firstItem.dataset.id);
        } else {
          await newChat();
        }
      } catch (e) {
        console.error('加载初始数据失败:', e);
      }
    }

    // --- DOM 引用 ---
    const chatInput = document.getElementById('chatInput');
    const btnSend = document.getElementById('btnSend');
    const messagesContainer = document.getElementById('messagesContainer');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const chatList = document.getElementById('chatList');

    // --- 输入处理 ---
    chatInput.addEventListener('input', () => {
      btnSend.disabled = chatInput.value.trim() === '';
    });

    function handleInputKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (chatInput.value.trim()) sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // --- 发送消息 ---
    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || isLoading) return;

      // 深度研究等待确认阶段：拦截确认/重新规划
      if (window._drWaitingConfirm) {
        chatInput.value = '';
        chatInput.style.height = 'auto';
        btnSend.disabled = true;

        if (text === '确认' || text === '开始' || text === '确认开始' || text === 'ok' || text === 'OK') {
          window._drWaitingConfirm = false;
          addMessage('user', text);
          executeDeepResearch(window._drQuery, window._drSubTasks);
        } else {
          // 用新输入重新规划
          window._drWaitingConfirm = false;
          welcomeScreen.style.display = 'none';
          messagesContainer.style.display = 'block';
          addMessage('user', text);
          btnSend.disabled = true;
          if (deepResearchActive) {
            startDeepResearch(text);
          }
        }
        return;
      }

      // 隐藏欢迎界面
      welcomeScreen.style.display = 'none';
      messagesContainer.style.display = 'block';

      addMessage('user', text);
      chatInput.value = '';
      chatInput.style.height = 'auto';
      btnSend.disabled = true;

      if (deepResearchActive) {
        startDeepResearch(text);
      } else {
        simulateReply(text);
      }
    }

    function sendSuggestion(text) {
      chatInput.value = text;
      sendMessage();
    }

    function addMessage(role, content) {
      messages.push({ role, content, time: new Date() });
      renderMessages();
      scrollToBottom();
    }

    function renderMessages() {
      messagesContainer.innerHTML = messages.map(msg => {
        const time = msg.time.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        if (msg.role === 'user') {
          return `
            <div class="message message-user">
              <div class="message-avatar">我</div>
              <div class="message-body">
                <div class="message-content">${escapeHtml(msg.content)}</div>
                <div class="message-meta"><span>${time}</span></div>
              </div>
            </div>`;
        }
        return `
          <div class="message message-assistant">
            <div class="message-avatar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </div>
            <div class="message-body">
              <div class="message-content">${msg.role === 'assistant' ? (msg._html ? msg.content : marked.parse(msg.content)) : escapeHtml(msg.content)}</div>
              <div class="message-meta">
                <span>${time}</span>
              </div>
              <div class="message-actions">
                <button class="message-action-btn" onclick="copyMessage(this, '${escapeAttr(msg.content)}')">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  复制
                </button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    async function simulateReply(userText) {
      if (!currentChatId) {
        await newChat();
      }
      isLoading = true;

      // 显示打字指示器
      const typingEl = document.createElement('div');
      typingEl.className = 'typing-indicator';
      typingEl.id = 'typingIndicator';
      typingEl.innerHTML = `
        <div class="message-avatar" style="background: linear-gradient(135deg, var(--color-primary), var(--color-primary-container)); color: white;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>
        </div>
        <div class="typing-dots"><span></span><span></span><span></span></div>`;
      messagesContainer.appendChild(typingEl);
      scrollToBottom();

      let fullReply = '';
      let streamEl = null;

      ssePost('/chat', {
        session_id: currentChatId,
        message: userText,
        model: currentModel,
        doc_ids: getSelectedDocIds(),
      }, {
        onToken: (content) => {
          fullReply += content;
          if (!streamEl) {
            typingEl.remove();
            // 首次收到 token，创建助手消息 DOM
            messages.push({ role: 'assistant', content: fullReply, time: new Date(), _finished: false });
            const div = document.createElement('div');
            div.className = 'message message-assistant';
            div.innerHTML = `
              <div class="message-avatar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
              </div>
              <div class="message-body">
                <div class="message-content"></div>
              </div>`;
            messagesContainer.appendChild(div);
            streamEl = div.querySelector('.message-content');
          } else {
            messages[messages.length - 1].content = fullReply;
          }
          streamEl.innerHTML = marked.parse(fullReply);
          scrollToBottom();
        },
        onDone: () => {
          if (messages.length > 0 && messages[messages.length - 1].role === 'assistant') {
            messages[messages.length - 1]._finished = true;
          }
          typingEl.remove();
          isLoading = false;
        },
        onError: (err) => {
          typingEl.remove();
          addMessage('assistant', '抱歉，回复时出现错误：' + err.message);
          isLoading = false;
        },
      });
    }

    // --- 对话管理 ---
    async function newChat() {
      try {
        const session = await api('POST', '/sessions');
        currentChatId = session.id;
        messages = [];
        messagesContainer.innerHTML = '';
        welcomeScreen.style.display = 'flex';
        messagesContainer.style.display = 'none';
        chatList.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        document.querySelector('.top-bar-title').textContent = '新对话';
        await loadSessionList();
      } catch (e) {
        console.error('创建会话失败:', e);
      }
    }

    async function deleteChat(id) {
      try {
        await api('DELETE', `/sessions/${id}`);
        await loadSessionList();
      } catch (e) {
        console.error('删除会话失败:', e);
      }
    }

    async function renameChat(id, btn) {
      const li = btn.closest('.sidebar-item');
      const textEl = li.querySelector('.item-text');
      const oldTitle = textEl.textContent;

      // 隐藏操作按钮，阻止点击切换会话
      li.classList.add('renaming');
      li.onclick = null;

      const input = document.createElement('input');
      input.type = 'text';
      input.value = oldTitle;
      input.className = 'rename-input';
      textEl.replaceWith(input);
      input.focus();
      input.select();

      let finished = false;
      const finish = async () => {
        if (finished) return;
        finished = true;
        const newTitle = input.value.trim() || oldTitle;
        if (newTitle !== oldTitle) {
          try {
            await api('PATCH', `/sessions/${id}`, { title: newTitle });
            if (id === currentChatId) {
              document.querySelector('.top-bar-title').textContent = newTitle;
            }
          } catch (e) {
            console.error('重命名失败:', e);
          }
        }
        const span = document.createElement('span');
        span.className = 'item-text';
        span.textContent = newTitle;
        input.replaceWith(span);
        // 恢复按钮和点击事件
        li.classList.remove('renaming');
        li.onclick = () => loadSession(id);
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { input.value = oldTitle; input.blur(); }
      });
      input.addEventListener('blur', finish);
    }

    async function loadSessionList() {
      try {
        const sessions = await api('GET', '/sessions');
        chatList.innerHTML = sessions.map(s => `
          <li class="sidebar-item ${s.id === currentChatId ? 'active' : ''}" data-id="${s.id}" onclick="loadSession('${s.id}')">
            <svg class="item-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="item-text">${escapeHtml(s.title)}</span>
            <button class="item-action" title="重命名" onclick="event.stopPropagation(); renameChat('${s.id}', this)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="item-action" title="删除" onclick="event.stopPropagation(); deleteChat('${s.id}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </li>`).join('');
      } catch (e) {
        console.error('加载会话列表失败:', e);
      }
    }

    async function loadSession(sessionId) {
      try {
        const data = await api('GET', `/sessions/${sessionId}`);
        currentChatId = sessionId;
        chatList.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        const item = chatList.querySelector(`[data-id="${sessionId}"]`);
        if (item) item.classList.add('active');
        document.querySelector('.top-bar-title').textContent = data.title;

        messages = [];
        welcomeScreen.style.display = 'none';
        messagesContainer.style.display = 'block';
        messagesContainer.innerHTML = '';

        for (const m of (data.messages || [])) {
          messages.push({ role: m.role, content: m.content, time: new Date(m.created_at) });
        }
        renderMessages();
        scrollToBottom();

        if (window.innerWidth <= 768) toggleSidebar();
      } catch (e) {
        console.error('加载会话失败:', e);
      }
    }

    // --- 工具函数 ---
    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return str.replace(/'/g, "\\'").replace(/\n/g, '\\n');
    }

    function copyMessage(btn, text) {
      navigator.clipboard.writeText(text.replace(/<[^>]*>/g, '')).then(() => {
        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 已复制`;
        setTimeout(() => {
          btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 复制`;
        }, 1500);
      });
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobileOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    // --- 知识库 & 模型面板 ---
    function togglePanel(type) {
      const kbPanel = document.getElementById('kbPanel');
      const modelPanel = document.getElementById('modelPanel');
      const btnKb = document.getElementById('btnKb');
      const btnModel = document.getElementById('btnModel');

      if (type === 'kb') {
        const isActive = kbPanel.classList.contains('active');
        closeAllPanels();
        if (!isActive) {
          kbPanel.classList.add('active');
          btnKb.classList.add('active');
        }
      } else {
        const isActive = modelPanel.classList.contains('active');
        closeAllPanels();
        if (!isActive) {
          modelPanel.classList.add('active');
          btnModel.classList.add('active');
        }
      }
    }

    function closeAllPanels() {
      document.getElementById('kbPanel').classList.remove('active');
      document.getElementById('modelPanel').classList.remove('active');
      document.getElementById('btnKb').classList.remove('active');
      document.getElementById('btnModel').classList.remove('active');
    }

    // 点击外部关闭面板
    document.addEventListener('click', (e) => {
      const toolbar = document.querySelector('.chat-toolbar');
      if (toolbar && !toolbar.contains(e.target)) {
        closeAllPanels();
      }
    });

    // --- 知识库列表渲染 ---
    function switchKbTab(tab) {
      currentKbTab = tab;
      document.querySelectorAll('.kb-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      renderKbList(document.getElementById('kbSearch').value);
    }

    function renderKbList(filter = '') {
      const list = document.getElementById('kbList');
      const keyword = filter.toLowerCase();

      if (currentKbTab === 'category') {
        const filtered = kbCategories.filter(c => c.name.toLowerCase().includes(keyword));
        if (filtered.length === 0) {
          list.innerHTML = '<div style="padding:16px;text-align:center;color:var(--color-outline);font-size:13px;">暂无知识库分类</div>';
          return;
        }
        list.innerHTML = filtered.map(c => `
          <label class="kb-item">
            <input type="checkbox" value="${c.id}" ${selectedKbIds.has(c.id) ? 'checked' : ''} onchange="toggleKbCategory('${c.id}')">
            <div class="kb-item-info">
              <div class="kb-item-name">${c.name}</div>
              <div class="kb-item-meta">${c.docs} 文档 · 更新于 ${c.updated}</div>
            </div>
          </label>
        `).join('');
      } else {
        const filtered = kbDocuments.filter(d => d.title.toLowerCase().includes(keyword));
        if (filtered.length === 0) {
          list.innerHTML = '<div style="padding:16px;text-align:center;color:var(--color-outline);font-size:13px;">暂无文档</div>';
          return;
        }
        list.innerHTML = filtered.map(d => `
          <label class="kb-item">
            <input type="checkbox" value="${d.id}" ${selectedDocIds.has(d.id) ? 'checked' : ''} onchange="toggleDoc(${d.id})">
            <div class="kb-item-info">
              <div class="kb-item-name">${d.title}</div>
              <div class="kb-item-meta">${d.file_type}${Array.isArray(d.tags) && d.tags.length ? ' · ' + d.tags.join(', ') : ''}</div>
            </div>
          </label>
        `).join('');
      }
    }

    function toggleKbCategory(id) {
      if (selectedKbIds.has(id)) {
        selectedKbIds.delete(id);
      } else {
        selectedKbIds.add(id);
        // 选中分类时，自动选中该分类下所有文档
        const cat = kbCategories.find(c => c.id === id);
        if (cat && cat.doc_ids) {
          cat.doc_ids.forEach(did => selectedDocIds.add(did));
        }
      }
      // 取消选中分类时，移除该分类下的文档
      if (!selectedKbIds.has(id)) {
        const cat = kbCategories.find(c => c.id === id);
        if (cat && cat.doc_ids) {
          cat.doc_ids.forEach(did => {
            // 只移除不属于其他选中分类的文档
            const inOther = kbCategories.some(c => c.id !== id && selectedKbIds.has(c.id) && c.doc_ids?.includes(did));
            if (!inOther) selectedDocIds.delete(did);
          });
        }
      }
      updateKbCount();
      renderKbList(document.getElementById('kbSearch').value);
    }

    function toggleDoc(id) {
      if (selectedDocIds.has(id)) {
        selectedDocIds.delete(id);
      } else {
        selectedDocIds.add(id);
      }
      updateKbCount();
    }

    function updateKbCount() {
      const countEl = document.getElementById('kbCount');
      const namesEl = document.getElementById('kbSelectedNames');
      const count = selectedDocIds.size;
      if (count > 0) {
        countEl.textContent = count;
        countEl.style.display = 'inline-flex';
        // 显示选中的分类名或文档名
        const names = [];
        selectedKbIds.forEach(id => {
          const cat = kbCategories.find(c => c.id === id);
          if (cat) names.push(cat.name);
        });
        if (names.length === 0) {
          // 只选了文档没选分类
          const docNames = [];
          selectedDocIds.forEach(id => {
            const doc = kbDocuments.find(d => d.id === id);
            if (doc) docNames.push(doc.title);
          });
          namesEl.textContent = docNames.slice(0, 2).join(', ') + (docNames.length > 2 ? '...' : '');
        } else {
          namesEl.textContent = names.join(', ');
        }
      } else {
        countEl.style.display = 'none';
        namesEl.textContent = '';
      }
    }

    function getSelectedDocIds() {
      return Array.from(selectedDocIds);
    }

    function filterKbList() {
      const keyword = document.getElementById('kbSearch').value;
      renderKbList(keyword);
    }

    // --- 模型列表渲染 ---
    function renderModelList() {
      const list = document.getElementById('modelList');
      list.innerHTML = models.map(m => `
        <div class="model-option ${m.id === currentModel ? 'selected' : ''}" onclick="selectModel('${m.id}')">
          <span class="model-check">${m.id === currentModel ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}</span>
          <span class="model-name">${m.name}</span>
          <span class="model-provider">${m.provider}</span>
        </div>
      `).join('');
    }

    function selectModel(id) {
      currentModel = id;
      const model = models.find(m => m.id === id);
      document.getElementById('currentModelName').textContent = model.name;
      renderModelList();
      closeAllPanels();
    }

    // --- 深度研究模式 ---
    function toggleDeepResearch() {
      deepResearchActive = !deepResearchActive;
      const btn = document.getElementById('btnDeepResearch');
      btn.classList.toggle('deep-research-active', deepResearchActive);
      const input = document.getElementById('chatInput');
      input.placeholder = deepResearchActive
        ? '输入研究问题，AI 将自动规划子任务并深度研究...'
        : '输入你的金融分析问题...';
    }

    async function startDeepResearch(query) {
      isLoading = true;
      addMessage('assistant', '> **深度研究模式已启动，正在规划研究框架...**\n');

      try {
        const data = await api('POST', '/research/plan', { query });
        drPlanData = data;

        // 展示子任务卡片
        let cardHtml = `> **研究框架：** ${escapeHtml(data.research_outline)}\n\n`;
        cardHtml += '**请确认以下子任务（发送"确认"开始执行，或输入修改意见）：**\n\n';
        data.sub_tasks.forEach((t, i) => {
          const tools = t.tools.map(tool => `\`${tool}\``).join(' ');
          cardHtml += `**${i + 1}. ${escapeHtml(t.title)}** — ${escapeHtml(t.description)}\n   工具：${tools}\n\n`;
        });
        cardHtml += `\n---\n> 输入"确认"或"开始"执行研究，输入其他内容将重新规划。`;

        addMessage('assistant', cardHtml);

        // 等待用户确认
        window._drWaitingConfirm = true;
        window._drQuery = query;
        window._drSubTasks = data.sub_tasks;

      } catch (e) {
        addMessage('assistant', `**规划失败：** ${e.message}`);
      }
      isLoading = false;
    }

    async function executeDeepResearch(query, subTasks) {
      isLoading = true;
      addMessage('assistant', '> **正在并行执行子任务，搜集信息中...**\n');

      // 进度条
      const progressHtml = subTasks.map((t, i) =>
        `<div class="dr-step" id="dr-step-${i}"></div>`
      ).join('');
      const progressMsg = {
        role: 'assistant',
        content: `<div class="dr-progress-bar">${progressHtml}</div>`,
        time: new Date(),
        _html: true,
      };
      messages.push(progressMsg);
      renderMessages();
      scrollToBottom();

      try {
        const res = await fetch('/api/research/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, sub_tasks: subTasks }),
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let reportId = null;
        let stepDone = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          let currentEvent = '';
          for (const line of lines) {
            if (line.startsWith('event: ')) {
              currentEvent = line.slice(7);
            } else if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                if (currentEvent === 'executor_done') {
                  // 标记进度条步骤完成
                  const idx = subTasks.findIndex(t => t.id === data.task_id);
                  if (idx >= 0) {
                    const stepEl = document.getElementById(`dr-step-${idx}`);
                    if (stepEl) stepEl.className = 'dr-step done';
                  }
                } else if (currentEvent === 'generate_start') {
                  // 标记所有步骤完成
                  subTasks.forEach((_, i) => {
                    const stepEl = document.getElementById(`dr-step-${i}`);
                    if (stepEl) stepEl.className = 'dr-step done';
                  });
                } else if (currentEvent === 'generate_done') {
                  reportId = data.report_id;
                } else if (currentEvent === 'done') {
                  // 加载并展示报告
                  if (reportId) {
                    const report = await api('GET', `/research/reports/${reportId}`);
                    addMessage('assistant', report.content);
                  }
                }
              } catch (e) {}
              currentEvent = '';
            }
          }
        }
      } catch (e) {
        addMessage('assistant', `**执行失败：** ${e.message}`);
      }
      isLoading = false;
    }

    // --- 初始化 ---
    loadInitialData();
  </script>
</body>
